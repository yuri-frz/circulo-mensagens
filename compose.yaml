services:
  api:
    build:
      context: .
      target: api
    volumes:
      - dados:/data
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  web:
    build:
      context: .
      target: web
    environment:
      EXPO_OFFLINE: "1"
    volumes:
      - ./App.js:/app/App.js:ro
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy
volumes:
  dados:
